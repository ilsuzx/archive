<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sonic Lens</title>
<style>
  :root { --bg:#fafaf9; --card:#fff; --fg:#1c1917; --mut:#78716c; --line:#e7e5e4; --ac:#4f46e5; --ac-fg:#fff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151413; --card:#1c1b1a; --fg:#e7e5e4; --mut:#a8a29e; --line:#2e2c2a; --ac:#818cf8; --ac-fg:#151413; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; }
  header { border-bottom:1px solid var(--line); background:var(--card); }
  .wrap { max-width:1080px; margin:0 auto; padding:0 16px; }
  .top { display:flex; flex-wrap:wrap; align-items:center; gap:12px; padding:14px 0; }
  h1 { font-size:16px; margin:0; font-weight:700; }
  form { flex:1; display:flex; gap:8px; min-width:260px; }
  input[type=text] { flex:1; padding:8px 12px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  input[type=text]:focus-visible, button:focus-visible, summary:focus-visible { outline:2px solid var(--ac); outline-offset:1px; }
  button { font:inherit; padding:7px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); cursor:pointer; }
  button:hover { border-color:var(--mut); }
  button.primary { background:var(--ac); color:var(--ac-fg); border-color:var(--ac); font-weight:600; }
  button.small { padding:2px 8px; font-size:12px; }
  #candBox { margin-top:8px; font-size:13px; }
  #candBox summary { cursor:pointer; color:var(--mut); }
  .cand { display:flex; gap:10px; align-items:center; width:100%; text-align:left; margin-top:6px; padding:6px 10px; }
  .cand img { width:36px; height:36px; border-radius:4px; flex:none; background:var(--line); }
  .cand .t { font-weight:600; }
  .cand.on { border-color:var(--ac); }
  .status { display:flex; justify-content:space-between; gap:12px; padding:8px 0; color:var(--mut); font-size:12px; border-top:1px solid var(--line); }
  main { max-width:1080px; margin:0 auto; padding:16px; display:grid; grid-template-columns:minmax(0,5fr) minmax(0,7fr); gap:16px; }
  @media (max-width:820px) { main { grid-template-columns:1fr; } }
  .col { display:flex; flex-direction:column; gap:16px; min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:16px; }
  h2 { font-size:13px; margin:0 0 10px; font-weight:700; }
  .muted { color:var(--mut); font-size:12px; }
  .track { display:flex; gap:12px; align-items:center; }
  .track img { width:72px; height:72px; border-radius:6px; object-fit:cover; background:var(--line); }
  .track div { min-width:0; }
  .track b, .track span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  audio { width:100%; margin-top:12px; height:36px; }
  canvas { width:100%; height:48px; display:block; margin-top:8px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat .v { font-size:26px; font-weight:700; line-height:1.2; }
  .stat .row { display:flex; gap:4px; margin-top:6px; }
  .dna { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px) { .dna { grid-template-columns:1fr; } }
  .group { border:1px solid var(--line); border-radius:6px; padding:12px; }
  .group h3 { font-size:12px; margin:0 0 8px; }
  .tag { margin-bottom:8px; }
  .tag .l { display:flex; justify-content:space-between; gap:8px; }
  .bar { height:3px; background:var(--line); border-radius:2px; margin:3px 0; }
  .bar i { display:block; height:100%; background:var(--ac); border-radius:2px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:1px 10px; font-size:12px; }
  .range { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--mut); }
  .range input { accent-color:var(--ac); }
  details { margin-top:10px; }
  summary { cursor:pointer; color:var(--mut); font-size:12px; }
  pre { white-space:pre-wrap; max-height:220px; overflow:auto; font:inherit; font-size:12px; margin:8px 0 0; }
  .prompt { font-family:ui-monospace,Menlo,monospace; font-size:12px; border:1px solid var(--line); border-radius:6px; padding:10px; margin-top:12px; user-select:all; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:10px; }
  .btns { display:flex; gap:8px; }
  .btns button { flex:1; }
  [hidden] { display:none !important; }
  .tabs { display:flex; gap:4px; }
  .tabs button { border:0; background:none; color:var(--mut); padding:6px 10px; }
  .tabs button[aria-selected=true] { color:var(--fg); background:var(--bg); font-weight:700; }
  .page { max-width:1080px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:16px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:820px) { .two { grid-template-columns:1fr; } }
  .sum { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .sum .v { font-size:22px; font-weight:700; line-height:1.3; }
  .hist { display:flex; align-items:flex-end; gap:3px; margin-top:8px; }
  .hist > div { flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; }
  .hist b { font-size:10px; font-weight:400; color:var(--mut); height:14px; line-height:14px; }
  .hist i { display:block; width:100%; background:var(--ac); border-radius:2px 2px 0 0; min-height:2px; }
  .hist span { font-size:10px; color:var(--mut); height:14px; line-height:14px; white-space:nowrap; }
  .split { display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--line); margin:6px 0; }
  .split i { display:block; height:100%; background:var(--ac); }
  .split i + i { background:var(--mut); }
  .progress { height:6px; background:var(--line); border-radius:3px; margin:10px 0 6px; overflow:hidden; }
  .progress i { display:block; height:100%; background:var(--ac); }
  .song { display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--line); }
  .song:first-child { border-top:0; }
  .song img { width:44px; height:44px; border-radius:4px; object-fit:cover; background:var(--line); flex:none; }
  .song .meta { flex:1; min-width:0; }
  .song .meta b, .song .meta span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>Sonic Lens</h1>
      <nav class="tabs" role="tablist" aria-label="화면 전환">
        <button type="button" role="tab" data-view="analysis" aria-selected="true">분석</button>
        <button type="button" role="tab" data-view="taste" aria-selected="false">내 취향</button>
      </nav>
      <form id="searchForm">
        <input id="searchInput" type="text" placeholder="곡 제목과 아티스트, 또는 YouTube·Apple Music 링크" aria-label="곡 검색" />
        <button class="primary" type="submit">분석</button>
      </form>
    </div>
    <div class="status"><span id="statusText">곡 제목을 입력하세요.</span><span id="info"></span></div>
    <details id="candBox" hidden><summary id="candSum"></summary><div id="candList"></div></details>
  </div>
</header>

<main id="analysisView">
  <div class="col">
    <section class="card">
      <div class="track">
        <img id="cover" alt="앨범 커버" />
        <div>
          <b id="title">곡을 검색하세요</b>
          <span id="artist" class="muted"></span>
          <span id="album" class="muted"></span>
        </div>
      </div>
      <audio id="player" controls></audio>
      <canvas id="spectrum" aria-hidden="true"></canvas>
    </section>

    <section class="card">
      <h2>템포와 키 <span class="muted" id="measureNote"></span></h2>
      <div class="stats">
        <div class="stat">
          <div class="muted">BPM</div>
          <div class="v" id="bpm">—</div>
          <div class="row">
            <button class="small" id="half" type="button">÷2</button>
            <button class="small" id="double" type="button">×2</button>
            <button class="small" id="tap" type="button">탭</button>
          </div>
        </div>
        <div class="stat">
          <div class="muted">키</div>
          <div class="v" id="key">—</div>
          <div class="muted" id="camelot"></div>
          <div class="muted" id="compat"></div>
        </div>
      </div>
    </section>

  </div>

  <div class="col">
    <section class="card">
      <div class="head">
        <h2 style="margin:0">사운드 분석</h2>
        <label class="range">최소 확신도
          <input id="thr" type="range" min="0" max="90" step="5" value="0" />
          <span id="thrVal">0%</span>
        </label>
      </div>
      <div class="muted" style="margin-bottom:10px">확신도는 AI가 스스로 추정한 값이며 정확도를 보증하지 않습니다.</div>
      <div id="dna" class="dna"></div>
    </section>

    <section class="card">
      <h2>가사와 분위기</h2>
      <div id="chips" class="chips"></div>
      <div id="summary" class="muted">곡을 분석하면 요약이 표시됩니다.</div>
      <details><summary>가사 보기</summary><pre id="lyrics"></pre></details>
    </section>
  </div>
</main>

<div id="tasteView" class="page" hidden>
  <div id="tasteStats"></div>
  <section class="card">
    <div class="head">
      <h2 style="margin:0">분석한 곡 <span class="muted" id="libCount"></span></h2>
      <div class="btns">
        <button type="button" class="small" id="expBtn">내보내기</button>
        <button type="button" class="small" id="impBtn">불러오기</button>
        <input id="impFile" type="file" accept="application/json,.json" hidden />
      </div>
    </div>
    <div class="muted" id="libMsg" role="status" style="margin-bottom:6px">분석 결과는 이 브라우저에만 저장됩니다. 브라우저 데이터를 지우기 전에 내보내기로 백업하세요.</div>
    <div id="libList"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia-wasm.web.js"></script>
<script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia.js-core.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const KS_MAJ = [6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88];
const KS_MIN = [6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17];

let cur = null, curKey = '', tapTimes = [];
let audioCtx = null, analyser = null, connected = false, blobUrl = null;

const setStatus = (m) => { $('statusText').textContent = m; };
const keyName = (k) => k ? `${NOTES[k.pc]} ${k.minor ? 'Minor' : 'Major'}` : '—';

// ---------- 음악 이론 ----------
function camelot(k) {
  const major = k.minor ? (k.pc + 3) % 12 : k.pc;
  return `${(((major * 7) % 12) + 7) % 12 + 1}${k.minor ? 'A' : 'B'}`;
}
function compat(k) {
  const c = camelot(k), n = parseInt(c), L = c.slice(-1), o = L === 'A' ? 'B' : 'A';
  const w = (x) => ((x + 11) % 12) + 1;
  return [`${n}${o}`, `${w(n - 1)}${L}`, `${w(n + 1)}${L}`].join(', ');
}
// ---------- 오디오 분석 (BPM / 키) ----------
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let b = n >> 1;
    for (; j & b; b >>= 1) j ^= b;
    j ^= b;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const a = -2 * Math.PI / len, wr = Math.cos(a), wi = Math.sin(a);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const u = i + k, v = u + len / 2;
        const tr = re[v] * cr - im[v] * ci, ti = re[v] * ci + im[v] * cr;
        re[v] = re[u] - tr; im[v] = im[u] - ti; re[u] += tr; im[u] += ti;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
      }
    }
  }
}

function detectBpm(x, sr) {
  const hop = 256, win = 512, frames = Math.floor((x.length - win) / hop);
  if (frames < 200) return null;
  const env = new Float32Array(frames);
  for (let f = 0; f < frames; f++) {
    let s = 0;
    for (let i = 0; i < win; i++) { const v = x[f * hop + i]; s += v * v; }
    env[f] = Math.sqrt(s / win);
  }
  const o = new Float32Array(frames);
  let mean = 0;
  for (let i = 1; i < frames; i++) { o[i] = Math.max(0, env[i] - env[i - 1]); mean += o[i]; }
  mean /= frames;
  for (let i = 0; i < frames; i++) o[i] -= mean;

  const fps = sr / hop;
  const ac = (lag) => {
    const l = Math.floor(lag), fr = lag - l;
    let s = 0;
    for (let i = 0; i + l + 1 < frames; i++) s += o[i] * (o[i + l] * (1 - fr) + o[i + l + 1] * fr);
    return s / (frames - l);
  };
  let best = -Infinity, bpm = null;
  for (let b = 70; b <= 180; b += 0.5) {
    const lag = fps * 60 / b;
    const prior = Math.exp(-0.5 * Math.pow(Math.log2(b / 120) / 0.7, 2));
    const s = (ac(lag) + 0.5 * ac(lag * 2)) * prior;
    if (s > best) { best = s; bpm = b; }
  }
  return bpm ? Math.round(bpm) : null;
}

function detectKey(x, sr) {
  const N = 8192, hop = 8192;
  const re = new Float32Array(N), im = new Float32Array(N), chroma = new Float64Array(12);
  const hann = new Float32Array(N);
  for (let i = 0; i < N; i++) hann[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1));
  const lo = Math.ceil(65 * N / sr), hi = Math.floor(2000 * N / sr);
  const pcOf = new Int8Array(hi + 1);
  for (let k = lo; k <= hi; k++) {
    const midi = Math.round(69 + 12 * Math.log2((k * sr / N) / 440));
    pcOf[k] = ((midi % 12) + 12) % 12;
  }
  let used = 0;
  for (let p = 0; p + N <= x.length; p += hop) {
    let e = 0;
    for (let i = 0; i < N; i++) { const v = x[p + i]; re[i] = v * hann[i]; im[i] = 0; e += v * v; }
    if (e / N < 1e-6) continue;
    fft(re, im);
    for (let k = lo; k <= hi; k++) chroma[pcOf[k]] += Math.sqrt(Math.hypot(re[k], im[k]));
    used++;
  }
  if (!used) return null;
  const corr = (a, b) => {
    const ma = a.reduce((s, v) => s + v, 0) / 12, mb = b.reduce((s, v) => s + v, 0) / 12;
    let n = 0, da = 0, db = 0;
    for (let i = 0; i < 12; i++) { n += (a[i] - ma) * (b[i] - mb); da += (a[i] - ma) ** 2; db += (b[i] - mb) ** 2; }
    return n / Math.sqrt(da * db || 1);
  };
  let best = { pc: 0, minor: false, r: -2 };
  for (let pc = 0; pc < 12; pc++) {
    const rot = Array.from({ length: 12 }, (_, i) => chroma[(i + pc) % 12]);
    const rM = corr(rot, KS_MAJ), rm = corr(rot, KS_MIN);
    if (rM > best.r) best = { pc, minor: false, r: rM };
    if (rm > best.r) best = { pc, minor: true, r: rm };
  }
  return { pc: best.pc, minor: best.minor };
}

let essentiaP = null;
function getEssentia() {
  essentiaP ||= (typeof EssentiaWASM === 'function' && typeof Essentia === 'function')
    ? EssentiaWASM().then((w) => new Essentia(w))
    : Promise.reject(new Error('Essentia 로드 실패'));
  return essentiaP;
}

async function essentiaMeasure(x) {
  const es = await getEssentia();
  const v = es.arrayToVector(x);
  try {
    const r = es.RhythmExtractor2013(v, 208, 'multifeature', 40);
    const k = es.KeyExtractor(v);
    const flat = { Db: 'C#', Eb: 'D#', Gb: 'F#', Ab: 'G#', Bb: 'A#' };
    const pc = NOTES.indexOf(flat[k.key] || k.key);
    return {
      bpm: r.bpm ? Math.round(r.bpm) : null,
      key: pc >= 0 ? { pc, minor: k.scale === 'minor' } : null
    };
  } finally { try { v.delete(); } catch {} }
}

async function analyzeAudio(buf) {
  const ac = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
  try {
    const ab = await ac.decodeAudioData(buf.slice(0));
    const x = new Float32Array(ab.length);
    for (let c = 0; c < ab.numberOfChannels; c++) {
      const d = ab.getChannelData(c);
      for (let i = 0; i < x.length; i++) x[i] += d[i] / ab.numberOfChannels;
    }
    if (ab.sampleRate === 44100) {
      try {
        const m = await essentiaMeasure(x);
        if (m.bpm || m.key) return { ...m, engine: 'Essentia' };
      } catch {}
    }
    const half = new Float32Array(x.length >> 1);
    for (let i = 0; i < half.length; i++) half[i] = (x[2 * i] + x[2 * i + 1]) / 2;
    const sr = ab.sampleRate / 2;
    return { bpm: detectBpm(half, sr), key: detectKey(half, sr), engine: '기본 검출기' };
  } finally { ac.close(); }
}

async function loadAudio(url) {
  let res;
  try { res = await fetch(url); if (!res.ok) throw 0; }
  catch { res = await fetch('/api/preview?url=' + encodeURIComponent(url)); }
  if (!res.ok) throw new Error('미리듣기 오디오를 가져오지 못했습니다.');
  return res.arrayBuffer();
}

// ---------- 외부 데이터 ----------
async function resolveInput(raw) {
  const t = raw.trim();
  if (!/^https?:\/\//i.test(t)) return t;
  try {
    const u = new URL(t);
    if (/youtu\.?be/.test(u.hostname)) {
      const r = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(t));
      if (r.ok) return (await r.json()).title.replace(/\(.*?\)|\[.*?\]|official|video|m\/?v/gi, '').trim();
    }
    const skip = /^(track|album|song|watch|intl-kr|kr|us|jp)$/i;
    return decodeURIComponent(u.pathname.split('/').filter((p) => p && !skip.test(p) && !/^\d+$/.test(p) && !/^[A-Za-z0-9]{22}$/.test(p)).join(' ')).replace(/[-_+]/g, ' ').trim();
  } catch { return ''; }
}

async function searchCandidates(q) {
  // 한국 스토어를 먼저 검색하면 한글 제목/아티스트명이 나와 가사 DB 매칭률이 올라갑니다.
  const seen = new Set(), out = [];
  for (const c of ['kr', 'us']) {
    const r = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=music&entity=song&limit=8&country=${c}`);
    if (!r.ok) throw new Error('곡 검색에 실패했습니다.');
    for (const t of (await r.json()).results || []) {
      if (!seen.has(t.trackId)) { seen.add(t.trackId); out.push(t); }
    }
    if (out.length >= 3) break;
  }
  return out.slice(0, 8);
}

// 검색어가 1순위 곡의 제목과 아티스트를 모두 담고 있으면 바로 분석, 아니면 선택을 받는다
const norm = (s) => String(s || '').toLowerCase().replace(/\s*[\(\[].*?[\)\]]/g, '').replace(/[^\p{L}\p{N}]/gu, '');
function isStrong(q, t) {
  const qn = norm(q), tn = norm(t.trackName), an = norm(String(t.artistName).split(/[,&]/)[0]);
  return Boolean(tn && an && qn.includes(tn) && qn.includes(an));
}

let candData = [];
function renderCands(list, auto) {
  candData = list;
  const box = $('candBox');
  if (list.length < 2) { box.hidden = true; return; }
  $('candSum').textContent = auto ? `다른 곡이 맞나요? 검색 결과 ${list.length}개` : `검색 결과 ${list.length}개 — 분석할 곡을 선택하세요`;
  $('candList').innerHTML = list.map((t, i) => `<button type="button" class="cand${auto && i === 0 ? ' on' : ''}" data-i="${i}">
    <img src="${esc(t.artworkUrl60 || '')}" alt="" />
    <span><span class="t">${esc(t.trackName)}</span><br><span class="muted">${esc(t.artistName)} · ${esc(t.collectionName || 'Single')}${t.releaseDate ? ' · ' + esc(t.releaseDate.slice(0, 4)) : ''}${t.previewUrl ? '' : ' · 미리듣기 없음'}</span></span>
  </button>`).join('');
  box.open = !auto; box.hidden = false;
}

async function fetchLyrics(t) {
  const clean = (s) => (s || '').replace(/\[\d{2}:\d{2}(?:\.\d{1,3})?\]\s*/g, '').trim();
  const J = async (u) => { try { const r = await fetch(u); return r.ok ? await r.json() : null; } catch { return null; } };
  const e = encodeURIComponent, L = 'https://lrclib.net/api/';
  const dur = t.trackTimeMillis ? t.trackTimeMillis / 1000 : 0;
  const title = t.trackName.replace(/\s*[\(\[].*?[\)\]]/g, '').trim() || t.trackName;
  const artist = t.artistName.split(/[,&]/)[0].trim();
  const ok = (d) => d && (d.plainLyrics || d.syncedLyrics) && (!dur || !d.duration || Math.abs(d.duration - dur) <= 6);
  const pick = (list) => Array.isArray(list) ? list.find(ok) : null;

  let d = await J(`${L}get?track_name=${e(t.trackName)}&artist_name=${e(t.artistName)}&album_name=${e(t.collectionName || '')}&duration=${Math.round(dur)}`);
  if (!ok(d)) d = pick(await J(`${L}search?track_name=${e(title)}&artist_name=${e(artist)}`));
  if (!ok(d)) d = pick(await J(`${L}search?q=${e(title + ' ' + artist)}`));
  if (!ok(d)) d = pick(await J(`${L}search?q=${e(title)}`));
  let text = ok(d) ? clean(d.plainLyrics || d.syncedLyrics) : '';

  if (!text) {
    const o = await J(`https://api.lyrics.ovh/v1/${e(artist)}/${e(title)}`);
    text = (o?.lyrics || '').trim();
  }
  return text ? { text, found: true } : { text: '가사를 찾지 못했습니다.', found: false };
}

async function analyzeAI(t, lyr, m) {
  const r = await fetch('/api/analyze', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      trackName: t.trackName, artistName: t.artistName, albumName: t.collectionName,
      genreHint: t.primaryGenreName, lyrics: lyr.found ? lyr.text : '',
      bpm: m?.bpm || null, keyName: m?.key ? keyName(m.key) : null
    })
  });
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    if (j.debug) console.warn('[AI 분석 실패]', j.code, j.debug);
    throw new Error(j.error || `AI 분석 요청 실패 (HTTP ${r.status})`);
  }
  return r.json();
}

// ---------- 스펙트럼 ----------
function setupVisualizer() {
  const p = $('player'), cv = $('spectrum'), g = cv.getContext('2d');
  const fit = () => {
    const r = devicePixelRatio || 1;
    cv.width = cv.clientWidth * r; cv.height = cv.clientHeight * r;
  };
  new ResizeObserver(fit).observe(cv); fit();

  p.addEventListener('play', () => {
    audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!connected && blobUrl) {
      const src = audioCtx.createMediaElementSource(p);
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 128;
      src.connect(analyser); analyser.connect(audioCtx.destination);
      connected = true;
    }
  });

  const color = () => getComputedStyle(document.documentElement).getPropertyValue('--ac').trim();
  (function draw() {
    requestAnimationFrame(draw);
    const w = cv.width, h = cv.height, bars = 40, bw = w / bars;
    g.clearRect(0, 0, w, h);
    g.fillStyle = color();
    const live = analyser && !p.paused;
    const arr = live ? new Uint8Array(analyser.frequencyBinCount) : null;
    if (live) analyser.getByteFrequencyData(arr);
    g.globalAlpha = live ? 1 : 0.25;
    for (let i = 0; i < bars; i++) {
      const v = live ? arr[Math.floor(i * arr.length / bars)] / 255 : 0;
      const bh = Math.max(2, v * h);
      g.fillRect(i * bw + 1, h - bh, Math.max(1, bw - 2), bh);
    }
    g.globalAlpha = 1;
  })();
}

async function tryCache(my) {
  const cached = store.get(curKey);
  if (!cached?.track) return false;
  setStatus('저장된 분석을 불러오는 중...');
  const buf = await (cached.track.previewUrl ? loadAudio(cached.track.previewUrl).catch(() => null) : null);

  render(cached, buf);

  if (cached.ai) { $('info').textContent = '저장된 결과'; return true; }
  $('info').textContent = '저장된 측정값 사용, AI 분석 재시도 중...';
  await retryAI();

}

async function analyzeTrack(track, my) {
  try {
    setStatus('가사와 오디오를 가져오는 중...');
    const [lyr, buf] = await Promise.all([
      fetchLyrics(track),
      track.previewUrl ? loadAudio(track.previewUrl).catch(() => null) : null
    ]);
    if (my !== runSeq) return;

    setStatus('BPM과 키를 측정하는 중...');
    const m = buf ? await analyzeAudio(buf).catch(() => null) : null;
    if (my !== runSeq) return;

    setStatus('AI 분석 중...');
    let ai = null, aiErr = '';
    try { ai = await analyzeAI(track, lyr, m); } catch (e) { aiErr = e.message; }
    if (my !== runSeq) return;

    const data = { track, bpm: m?.bpm || null, key: m?.key || null, measured: Boolean(m?.bpm || m?.key), engine: m?.engine, ai, lyrics: lyr.text, lyricsFound: lyr.found, savedAt: Date.now() };
    if (data.measured || ai) persist(data, curKey);
    render(data, buf);
    $('info').textContent = ai ? 'AI + 오디오 측정' : `오디오 측정만 사용 (${aiErr})`;
    setStatus(`${track.artistName} – ${track.trackName}`);
  } catch (e) {
    if (my === runSeq) setStatus(`오류: ${e.message}`);
  }
}

// 후보 목록에서 직접 고른 곡: 곡 ID 기준으로 캐시

async function run(raw) {
  showView('analysis');
  const my = ++runSeq;
  const q = await resolveInput(raw);
  if (my !== runSeq) return;
  if (!q) { setStatus('링크에서 곡 제목을 찾지 못했습니다. 제목과 아티스트를 직접 입력하세요.'); return; }
  const qKey = 'sl4:' + q.toLowerCase();
  $('info').textContent = '';
  $('candBox').hidden = true;
  try {
    // 검색어 자체로는 캐시를 쓰지 않는다 (아티스트명만 검색해도 예전에 분석한 한 곡이 바로 뜨는 문제 방지)
    setStatus(`"${q}" 검색 중...`);
    const list = await searchCandidates(q);
    if (my !== runSeq) return;
    if (!list.length) { setStatus(`"${q}" 검색 결과가 없습니다. 다른 키워드로 시도해 보세요.`); return; }

    const auto = list.length === 1 || isStrong(q, list[0]);
    renderCands(list, auto);
    if (!auto) { setStatus('여러 곡이 검색되었습니다. 분석할 곡을 선택하세요.'); return; }
    // 분명히 이 곡이라고 판단되면 곡 ID 기준으로 캐시를 확인한다
    const t0 = list[0], idKey = 'sl4:id:' + t0.trackId;
    const old = store.get(qKey);
    if (!store.get(idKey) && old?.track?.trackId === t0.trackId) store.set(idKey, old);  // 예전 검색어 키 저장분 이전
    curKey = idKey;
    if (await tryCache(my)) return;
    await analyzeTrack(t0, my);
  } catch (e) {
    if (my === runSeq) setStatus(`오류: ${e.message}`);
  }
}

// ---------- 내 취향: 저장된 분석 모음 ----------
const LIB_PREFIX = 'sl4:';
const MIN_SONGS = 5;
const CATS = [
  { id: 'genre', title: '장르 & 세부 장르', re: /장르|genre/i },
  { id: 'inst', title: '주요 악기', re: /악기|instrument/i },
  { id: 'vocal', title: '보컬 스타일', re: /보컬|vocal/i },
  { id: 'mood', title: '분위기', re: /분위기|mood/i }
];
// 영어/한국어 표기가 섞인 같은 태그를 합치기 위한 별칭표 (키는 normLabel 처리 후 형태)
const ALIAS = {
  '힙합':'hiphop','랩':'rap','알앤비':'r&b','rnb':'r&b','케이팝':'kpop','팝':'pop','록':'rock','락':'rock',
  '재즈':'jazz','인디':'indie','발라드':'ballad','로파이':'lofi','하우스':'house','트랩':'trap','소울':'soul',
  '펑크':'funk','포크':'folk','댄스':'dance','신스팝':'synthpop','앰비언트':'ambient','일렉트로닉':'electronic',
  '어쿠스틱':'acoustic','오케스트라':'orchestral','클래식':'classical','메탈':'metal','블루스':'blues','레게':'reggae',
  '기타':'guitar','어쿠스틱기타':'acousticguitar','일렉트릭기타':'electricguitar','피아노':'piano','드럼':'drums',
  'drum':'drums','베이스':'bass','베이스기타':'bassguitar','신디사이저':'synthesizer','신스':'synthesizer','synth':'synthesizer',
  'synths':'synthesizer','현악기':'strings','스트링':'strings','스트링스':'strings','바이올린':'violin','첼로':'cello',
  '808베이스':'808bass','키보드':'keyboard','브라스':'brass','색소폰':'saxophone','보컬':'vocals'
};
const normLabel = (s) => {
  const raw = String(s ?? '').toLowerCase();
  let t = raw.replace(/\s*[\(\[（].*?[\)\]）]/g, '');
  if (!t.trim()) t = raw;
  t = t.replace(/[\s\-_·\/.,]+/g, '');
  return ALIAS[t] || t;
};
const clampConf = (v) => Math.min(100, Math.max(0, Number(v) || 0));
const median = (a) => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

function persist(d, key) {
  store.set(key, d);
  // 같은 곡이 다른 키(검색어 키 / ID 키)로도 저장돼 있으면 함께 갱신해서 값이 어긋나지 않게 한다
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || k === key || !k.startsWith(LIB_PREFIX)) continue;
      if (store.get(k)?.track?.trackId === d.track?.trackId) store.set(k, d);
    }
  } catch {}
}

// 저장된 곡을 곡 ID 기준으로 중복 없이 모은다
function loadLib() {
  const byId = new Map();
  const rank = (x) => (x.ai ? 2 : 0) + (x.measured ? 1 : 0);
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || !k.startsWith(LIB_PREFIX)) continue;
      const d = store.get(k);
      if (!d?.track?.trackId) continue;
      const id = String(d.track.trackId);
      const e = byId.get(id) || { id, keys: [], d: null, key: '' };
      e.keys.push(k);
      if (!e.d || rank(d) > rank(e.d) || (rank(d) === rank(e.d) && (d.savedAt || 0) > (e.d.savedAt || 0))) { e.d = d; e.key = k; }
      byId.set(id, e);
    }
  } catch {}
  return [...byId.values()].sort((a, b) => (b.d.savedAt || 0) - (a.d.savedAt || 0));
}

function aggregate(lib) {
  const withAI = lib.filter((e) => Array.isArray(e.d.ai?.categories));
  const maps = Object.fromEntries(CATS.map((c) => [c.id, new Map()]));
  const moods = new Map();
  for (const e of withAI) {
    const seen = {};
    for (const c of e.d.ai.categories) {
      const def = CATS.find((x) => x.re.test(c.title || ''));
      if (!def) continue;
      const per = (seen[def.id] ||= new Map());
      for (const it of c.items || []) {
        const k = normLabel(it.label);
        if (!k) continue;
        const w = clampConf(it.conf) / 100;
        const p = per.get(k);
        if (!p || w > p.w) per.set(k, { w, label: String(it.label) });   // 한 곡 안에서 같은 태그는 한 번만 센다
      }
    }
    for (const id in seen) for (const [k, p] of seen[id]) {
      const a = maps[id].get(k) || { w: 0, n: 0, labels: new Map() };
      a.w += p.w; a.n++; a.labels.set(p.label, (a.labels.get(p.label) || 0) + 1);
      maps[id].set(k, a);
    }
    const mk = new Set();
    for (const raw of e.d.ai.moodKeywords || []) {
      const k = normLabel(raw);
      if (!k || mk.has(k)) continue;
      mk.add(k);
      const a = moods.get(k) || { n: 0, labels: new Map() };
      a.n++; a.labels.set(String(raw), (a.labels.get(String(raw)) || 0) + 1);
      moods.set(k, a);
    }
  }
  const topLabel = (labels) => [...labels.entries()].sort((a, b) => b[1] - a[1])[0][0];
  const cats = {};
  for (const c of CATS) {
    cats[c.id] = [...maps[c.id].values()]
      .sort((a, b) => b.w - a.w || b.n - a.n).slice(0, 6)
      .map((a) => ({ label: topLabel(a.labels), n: a.n, share: Math.round(a.w / withAI.length * 100) }));
  }
  const mood = [...moods.values()].sort((a, b) => b.n - a.n).slice(0, 20).map((a) => ({ label: topLabel(a.labels), n: a.n }));
  return { nAI: withAI.length, cats, mood };
}

function renderStats(lib) {
  const box = $('tasteStats');
  if (lib.length < MIN_SONGS) {
    box.innerHTML = `<section class="card"><h2>내 취향</h2><div>곡을 ${MIN_SONGS}곡 이상 분석하면 취향 통계가 표시됩니다.</div><div class="progress"><i style="width:${lib.length / MIN_SONGS * 100}%"></i></div><div class="muted">현재 ${lib.length}곡 / ${MIN_SONGS}곡</div></section>`;
    return;
  }
  const A = aggregate(lib);
  const bpms = lib.map((e) => e.d.bpm).filter(Boolean);
  const keys = lib.map((e) => e.d.key).filter((k) => k && Number.isInteger(k.pc));
  const camMap = new Map();
  for (const k of keys) {
    const c = camelot(k), a = camMap.get(c) || { n: 0, name: keyName(k) };
    a.n++; camMap.set(c, a);
  }
  const camTop = [...camMap.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 8);
  const minor = keys.filter((k) => k.minor).length, major = keys.length - minor;

  const sum = `<section class="card"><h2>한눈에 보기</h2><div class="sum">
    <div><div class="muted">분석한 곡</div><div class="v">${lib.length}곡</div></div>
    <div><div class="muted">AI 분석이 있는 곡</div><div class="v">${A.nAI}곡</div></div>
    <div><div class="muted">평균 BPM</div><div class="v">${bpms.length ? Math.round(bpms.reduce((a, b) => a + b, 0) / bpms.length) : '—'}</div></div>
    <div><div class="muted">가장 많은 키</div><div class="v">${camTop[0] ? esc(camTop[0][0]) : '—'}</div>${camTop[0] ? `<div class="muted">${esc(camTop[0][1].name)}</div>` : ''}</div>
  </div></section>`;

  let tags;
  if (!A.nAI) tags = `<section class="card"><h2>자주 나오는 사운드</h2><div class="muted">AI 분석이 저장된 곡이 없어 태그 통계를 만들 수 없습니다.</div></section>`;
  else tags = `<section class="card"><h2>자주 나오는 사운드</h2>
    <div class="muted" style="margin-bottom:10px">태그마다 AI 확신도를 곡별로 더해, AI 분석이 있는 ${A.nAI}곡 대비 비중으로 표시합니다.${A.nAI < lib.length ? ` AI 분석이 없는 ${lib.length - A.nAI}곡은 제외됩니다.` : ''} 영어·한국어 표기가 다른 같은 태그는 일부만 합쳐집니다.</div>
    <div class="dna">${CATS.map((c) => `<div class="group"><h3>${esc(c.title)}</h3>${A.cats[c.id].length ? A.cats[c.id].map((r) =>
      `<div class="tag"><div class="l"><span>${esc(r.label)}</span><span class="muted">${r.n}곡 · ${r.share}%</span></div><div class="bar"><i style="width:${r.share}%"></i></div></div>`).join('') : '<div class="muted">데이터가 없습니다.</div>'}</div>`).join('')}</div></section>`;

  let hist = '<div class="muted">측정된 BPM이 없습니다.</div>';
  if (bpms.length) {
    const lo = Math.floor(Math.min(...bpms) / 10) * 10, hi = Math.floor(Math.max(...bpms) / 10) * 10;
    const bins = [];
    for (let s = lo; s <= hi; s += 10) bins.push({ s, n: bpms.filter((b) => b >= s && b < s + 10).length });
    const mx = Math.max(...bins.map((b) => b.n));
    hist = `<div class="hist">${bins.map((b, i) => `<div title="${b.s}–${b.s + 9} BPM: ${b.n}곡"><b>${b.n || ''}</b><i style="height:${Math.round(b.n / mx * 64)}px${b.n ? '' : ';opacity:.25'}"></i><span>${bins.length > 10 && i % 2 ? '' : b.s}</span></div>`).join('')}</div>
      <div class="muted" style="margin-top:6px">중앙값 ${Math.round(median(bpms))} BPM · 범위 ${Math.min(...bpms)}–${Math.max(...bpms)} (${bpms.length}곡 측정)</div>`;
  }
  let keyHtml = '<div class="muted">측정된 키가 없습니다.</div>';
  if (keys.length) {
    keyHtml = `<div class="muted">Major ${major}곡 · Minor ${minor}곡</div>
      <div class="split" aria-hidden="true"><i style="width:${major / keys.length * 100}%"></i><i style="width:${minor / keys.length * 100}%"></i></div>
      <div class="muted" style="margin:10px 0 6px">자주 나오는 키 (Camelot)</div>
      <div class="chips">${camTop.map(([c, a]) => `<span class="chip">${esc(c)} ${esc(a.name)} <span class="muted">×${a.n}</span></span>`).join('')}</div>`;
  }
  const tempoKey = `<section class="card"><h2>템포와 키 분포</h2><div class="two">
    <div><div class="muted">BPM 분포 (10 BPM 단위)</div>${hist}</div>
    <div><div class="muted">Major / Minor</div>${keyHtml}</div></div></section>`;

  const mood = A.mood.length ? `<section class="card"><h2>분위기 키워드</h2><div class="chips" style="margin:0">${A.mood.map((m) =>
    `<span class="chip">${esc(m.label)}${m.n > 1 ? ` <span class="muted">×${m.n}</span>` : ''}</span>`).join('')}</div></section>` : '';

  box.innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">${sum}${tags}${tempoKey}${mood}</div>`;
}

function topGenre(d) {
  const g = (d.ai?.categories || []).find((c) => CATS[0].re.test(c.title || ''));
  const best = (g?.items || []).slice().sort((a, b) => clampConf(b.conf) - clampConf(a.conf))[0];
  return best ? String(best.label) : (d.track?.primaryGenreName || '');
}

function renderLib(lib) {
  $('libCount').textContent = lib.length ? `· ${lib.length}곡` : '';
  $('libList').innerHTML = lib.length ? lib.map((e) => {
    const d = e.d, t = d.track;
    const meta = [d.bpm ? `${d.bpm} BPM` : '', d.key ? `${keyName(d.key)} (${camelot(d.key)})` : '', topGenre(d), d.savedAt ? new Date(d.savedAt).toLocaleDateString('ko-KR') : ''].filter(Boolean).join(' · ');
    return `<div class="song">
      <img src="${esc(t.artworkUrl60 || '')}" alt="" />
      <div class="meta"><b>${esc(t.trackName)}</b><span class="muted">${esc(t.artistName)}</span><span class="muted">${esc(meta || '측정값 없음')}${d.ai ? '' : ' · AI 분석 없음'}</span></div>
      <button type="button" class="small" data-act="open" data-key="${esc(e.key)}">열기</button>
      <button type="button" class="small" data-act="del" data-id="${esc(e.id)}">삭제</button>
    </div>`;
  }).join('') : '<div class="muted">아직 분석한 곡이 없습니다. 곡을 분석하면 여기에 쌓입니다.</div>';
}

function renderTaste() { const lib = loadLib(); renderStats(lib); renderLib(lib); }

function showView(v) {
  $('analysisView').hidden = v !== 'analysis';
  $('tasteView').hidden = v !== 'taste';
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.view === v)));
  if (v === 'taste') renderTaste();
}
document.querySelectorAll('.tabs button').forEach((b) => { b.onclick = () => showView(b.dataset.view); });

async function openSaved(key) {
  showView('analysis');
  window.scrollTo(0, 0);
  const my = ++runSeq;
  curKey = key;
  $('info').textContent = '';
  $('candBox').hidden = true;
  try { if (!(await tryCache(my)) && my === runSeq) setStatus('저장된 분석을 찾지 못했습니다.'); }
  catch (e) { if (my === runSeq) setStatus(`오류: ${e.message}`); }
}

function deleteSaved(id) {
  const e = loadLib().find((x) => x.id === id);
  if (!e || !confirm(`"${e.d.track.trackName}" 분석 결과를 삭제할까요?`)) return;
  e.keys.forEach((k) => { try { localStorage.removeItem(k); } catch {} });
  if (cur && String(cur.track?.trackId) === id) { cur = null; curKey = ''; }
  renderTaste();
}

$('libList').addEventListener('click', (ev) => {
  const b = ev.target.closest('button[data-act]'); if (!b) return;
  if (b.dataset.act === 'open') openSaved(b.dataset.key);
  else if (b.dataset.act === 'del') deleteSaved(b.dataset.id);
});

// ---------- 내보내기 / 불러오기 ----------
const libMsg = (m) => { $('libMsg').textContent = m; };

$('expBtn').onclick = () => {
  const lib = loadLib();
  if (!lib.length) { libMsg('내보낼 곡이 없습니다.'); return; }
  const blob = new Blob([JSON.stringify({ app: 'sonic-lens', version: 1, exportedAt: new Date().toISOString(), items: lib.map((e) => e.d) })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `sonic-lens-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  libMsg(`${lib.length}곡을 내보냈습니다.`);
};

// 가져온 파일은 신뢰할 수 없으므로 필요한 필드만 골라 형식과 길이를 검증한다
const sStr = (v, n = 300) => (typeof v === 'string' ? v.slice(0, n) : '');
const sUrl = (v) => (typeof v === 'string' && /^https:\/\/([\w-]+\.)*(mzstatic\.com|apple\.com)\//i.test(v) ? v.slice(0, 500) : '');
function sanitizeEntry(raw) {
  const t = raw?.track;
  if (!t || !Number.isFinite(Number(t.trackId)) || !sStr(t.trackName) || !sStr(t.artistName)) return null;
  const track = {
    trackId: Number(t.trackId), trackName: sStr(t.trackName), artistName: sStr(t.artistName),
    collectionName: sStr(t.collectionName), primaryGenreName: sStr(t.primaryGenreName, 80), releaseDate: sStr(t.releaseDate, 30),
    trackTimeMillis: Number(t.trackTimeMillis) || 0, artworkUrl60: sUrl(t.artworkUrl60), artworkUrl100: sUrl(t.artworkUrl100), previewUrl: sUrl(t.previewUrl)
  };
  const bpm = Number(raw.bpm) >= 40 && Number(raw.bpm) <= 220 ? Math.round(Number(raw.bpm)) : null;
  const k = raw.key;
  const key = k && Number.isInteger(k.pc) && k.pc >= 0 && k.pc < 12 ? { pc: k.pc, minor: Boolean(k.minor) } : null;
  let ai = null;
  if (Array.isArray(raw.ai?.categories) && raw.ai.categories.length) {
    ai = {
      categories: raw.ai.categories.slice(0, 8).map((c) => ({
        title: sStr(c?.title, 60),
        items: (Array.isArray(c?.items) ? c.items : []).slice(0, 10).map((i) => ({ label: sStr(i?.label, 80), conf: clampConf(i?.conf), note: sStr(i?.note, 300) }))
      })),
      moodKeywords: (Array.isArray(raw.ai.moodKeywords) ? raw.ai.moodKeywords : []).slice(0, 12).map((s) => sStr(s, 40)),
      lyricsSummary: sStr(raw.ai.lyricsSummary, 1000)
    };
  }
  if (!ai && !bpm && !key) return null;
  return {
    track, bpm, key, measured: Boolean(bpm || key), engine: sStr(raw.engine, 30), ai,
    lyrics: sStr(raw.lyrics, 20000), lyricsFound: Boolean(raw.lyricsFound),
    savedAt: Number.isFinite(Number(raw.savedAt)) ? Number(raw.savedAt) : undefined
  };
}

$('impBtn').onclick = () => $('impFile').click();
$('impFile').onchange = async (ev) => {
  const f = ev.target.files[0]; ev.target.value = '';
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const items = Array.isArray(j) ? j : j?.items;
    if (!Array.isArray(items)) throw new Error('Sonic Lens 내보내기 파일이 아닙니다.');
    const have = new Set(loadLib().map((e) => e.id));
    let added = 0, skipped = 0, bad = 0;
    for (const raw of items.slice(0, 2000)) {
      const d = sanitizeEntry(raw);
      if (!d) { bad++; continue; }
      const id = String(d.track.trackId);
      if (have.has(id)) { skipped++; continue; }
      store.set('sl4:id:' + id, d); have.add(id); added++;
    }
    libMsg(`${added}곡을 불러왔습니다.${skipped ? ` 이미 있는 ${skipped}곡은 건너뛰었습니다.` : ''}${bad ? ` 형식이 맞지 않는 ${bad}곡은 제외했습니다.` : ''}`);
    renderTaste();
  } catch (e) { libMsg(`불러오기 실패: ${e.message}`); }
};

setupVisualizer();
</script>
